name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant permission to execute gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Get Version Name from Gradle
        id: version
        run: |
          VERSION_NAME=$(./gradlew -q printVersionName | tail -n 1)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-v${{ steps.version.outputs.VERSION_NAME }}-debug.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-v${{ steps.version.outputs.VERSION_NAME }}-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-v${{ steps.version.outputs.VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/app-v${{ steps.version.outputs.VERSION_NAME }}-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-v${{ steps.version.outputs.VERSION_NAME }}-release
          path: app/build/outputs/apk/release/app-v${{ steps.version.outputs.VERSION_NAME }}-release.apk
